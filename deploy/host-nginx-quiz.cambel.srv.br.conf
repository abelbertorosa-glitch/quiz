# Host nginx vhost. Proxy → container na 3060.
# Não editar gikadata.conf / skopus.app / oplanopy / blueprimesofas.

upstream quiz_cambel {
    server 127.0.0.1:3060;
}

server {
    listen 80;
    listen [::]:80;
    server_name quiz.cambel.srv.br;

    server_tokens off;
    client_max_body_size 8m;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://quiz_cambel;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name quiz.cambel.srv.br;

    server_tokens off;
    client_max_body_size 8m;

    ssl_certificate /etc/ssl/quiz-cambel/fullchain.pem;
    ssl_certificate_key /etc/ssl/quiz-cambel/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:QuizCambelSSL:10m;

    location / {
        proxy_pass http://quiz_cambel;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
