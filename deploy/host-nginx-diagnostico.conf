# Vhost do host (precisa root/sudo 1x). Não aplicar sem o DNS no ar.
# Apex do domínio: /cambel = LP, /diagnostico = quiz.
# upstream: 127.0.0.1:3060 (container quiz-cambel-web)

upstream quiz_cambel {
    server 127.0.0.1:3060;
}

server {
    listen 80;
    server_name diagnostico.cambel.srv.br diagnostico.cambelcontabilidade.com.br;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name diagnostico.cambel.srv.br diagnostico.cambelcontabilidade.com.br;

    # ssl_certificate /etc/letsencrypt/live/diagnostico.cambel.srv.br/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/diagnostico.cambel.srv.br/privkey.pem;

    client_max_body_size 8m;
    proxy_read_timeout 300s;

    location / {
        proxy_pass http://quiz_cambel;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
